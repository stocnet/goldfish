# Air formatter config — pinned to match .lintr (line_length_linter(80),
# 2-space tidy indentation). Air does not read .lintr, so keep these in sync,
# including the exclusion list below (mirrors .lintr `exclusions`).
[format]
line-width = 80
indent-width = 2
indent-style = "space"
line-ending = "auto"
exclude = [
  # auto-generated by Rcpp::compileAttributes() — reformatting is reverted on
  # the next compile, so leave it alone
  "R/RcppExports.R",
  "R/zzz.R",
  "inst/goldfish_logo.R",
  "tests/test_not_passed/**",
  "tests/testthat/_baselines/**",
]
