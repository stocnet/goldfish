destination: docs
url: https://stocnet.github.io/goldfish/
development:
    mode: auto
template:
  bootswatch: united
authors:
  James Hollway:
    href: https://jameshollway.com
  Christoph Stadtfeld:
    href: https://sn.ethz.ch/profile.html?persid=210738
navbar:
  structure:
    left:
    - home
    - intro
    - reference
    - articles
    - news
    right:
    - search
    - github
  components:
    home:
      icon: fa-home fa-lg
      href: index.html
    reference:
      text: Reference
      href: reference/index.html
    news:
      text: News
      href: news/index.html
    github:
      icon: "fab fa-github fa-lg"
      href: https://github.com/stocnet/goldfish
reference:
  - title: "Make"
    contents:
      - goldfish-package
      - goldfish_data
      - starts_with("make")
      - starts_with("link")
      - as_goldfish
      - add_flavor
      - network_state_at
      - nodes_state_at
  - title: "Estimate"
    contents:
      - starts_with("estimate")
      - starts_with("set")
      - update-method
      - print-method
  - title: "Diagnostics"
    contents:
      - logLik.result.goldfish
      - starts_with("diagnose")
      - residuals.result.goldfish
      - fitted.result.goldfish
      - predict.result.goldfish
      - augment.result.goldfish
      - evaluate_model
      - margin_table
      - model_terms
      - diagnostic-tables
      - risk_set_axis
  - title: "Data"
    desc: |
      The package contains several datasets that are used in vignettes
      to demonstrate features of goldfish.
    contents:
      - social_evolution_stocnet
      - fisheries_treaties
      - starts_with("Fisheries_")
      - starts_with("RFID_")
      - starts_with("Social_")
  - title: "Gather preprocessing"
    contents:
      - compute_statistics
      - gather_model_data
