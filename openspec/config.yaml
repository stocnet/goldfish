schema: spec-driven

context: |
  R package (goldfish): statistical models for dynamic network data
  (DyNAM, DyNAMi, REM). C++ via Rcpp/RcppArmadillo in src/.

  Workflow disciplines for implementing any change:
  - Commit after each completed small task (one focused commit per task,
    conventional message) so any step can be rolled back; tests must be
    green at every commit.
  - Run devtools::document() within any task that changes roxygen
    comments, exports, or function signatures — never defer documentation
    regeneration to a final cleanup task.
  - Folds (DESCRIPTION Version bump, NEWS.md, /opsx:archive, baseline
    refreezes, the versions ledger) happen ONLY at a merge into an
    integration branch — develop, or main for hotfixes. (Until
    2026-09-07 this read "currently refactor/rate_prep until the
    branching model normalizes"; rate_prep is now fully contained in
    develop, so develop is the integration branch.) Work done
    directly on the integration branch keeps the old per-phase-milestone
    bump (precedent: 1.7.2/1.7.3). On any other branch a milestone
    instead writes one fragment file to NEWS.d/ (protocol in
    NEWS.d/README.md) and touches neither the DESCRIPTION Version nor
    NEWS.md — branches produce facts, the trunk performs folds (vault
    ADR-0040, extended by ADR-0041; the DyNES merge is the precedent
    this prevents).
  - Run tests with NOT_CRAN=true (e.g. NOT_CRAN=true Rscript -e
    'devtools::test()'): the coefficient baseline and C++ golden tests
    are computationally expensive and use skip_on_cran(), so a bare
    Rscript run silently skips them and verifies nothing about
    coefficient reproducibility. Confirm they report PASS, not SKIP.
  - Format the R files touched by a task with air BEFORE linting them:
    `air format <paths>` (config in air.toml, pinned to .lintr's 80-column
    width and 2-space indentation), then `lintr::lint(<path>)` on the same
    files. Formatting first means lintr only reports what the formatter
    cannot fix (naming, line length in comments/strings, ...) instead of
    whitespace noise. Never run `air format` over the whole package in a
    task commit — only the files that task edited, so the diff stays
    reviewable.

  Required skills (hard rules — invoke the skill before doing the work it
  covers; do not rely on memory):
  - r-lib:r-package-development — ALWAYS, for any task touching package
    machinery (devtools load_all/test/document, roxygen2, NAMESPACE,
    DESCRIPTION, build infrastructure). This is the default working
    reference for implementation tasks.
  - r-lib:testing-r-packages — ALWAYS when creating or reorganising tests
    (testthat 3e: self-contained tests, fixtures, snapshots, mocking);
    use for every verification task and new test file.
  - r-lib:cli — ALWAYS, whenever anything is returned to the console
    (print/format methods, warnings, messages, errors, status output).
    The project standardises on cli (already in Imports; today used only
    for cli_abort/cli_warn). New output renders via cli semantic elements,
    interpolating data (not literal markup); pin a reproducible cli
    context for output snapshots.
  - r-lib:lifecycle — when deprecating, renaming, superseding, or marking
    an API experimental (deprecate_warn/deprecate_soft, lifecycle badges,
    NEWS). lifecycle is already in Imports.

  (These are also recorded in the project CLAUDE.md so they apply to all
  repo work, not only OpenSpec changes.)

rules:
  tasks:
    - End every task group with a verification task that runs the tests and, if the group touched roxygen docs or exported APIs, devtools::document()
    - Add an explicit "bump version in DESCRIPTION + NEWS.md entry" task at each phase milestone
    - Any task that deprecates, renames, supersedes, or introduces an experimental API MUST follow the r-lib:lifecycle skill (deprecate_warn / badge + NEWS entry)
    - New user-facing output (messages, conditions, print/format methods) MUST be rendered with cli per the r-lib:cli skill; output snapshot tests pin a reproducible cli context
    - Any task touching package machinery (devtools, roxygen2, NAMESPACE, DESCRIPTION, build) MUST follow the r-lib:r-package-development skill
    - Any task that creates or reorganises tests MUST follow the r-lib:testing-r-packages skill (testthat 3e)
    - Any task that edits src/ C++ (Rcpp/RcppArmadillo) MUST run the cpp-recompile skill after the edit and before testing — regenerate the Rcpp bindings (compileAttributes, verify the RcppExports.* diff) and force-recompile (load_all recompile = TRUE), so the coefficient/C++ golden baselines are not validated against a stale .o/.so. Never hand-edit R/RcppExports.R or src/RcppExports.cpp (a PreToolUse hook blocks it); regenerate via the skill.
    - Every task MUST be verified with the not-cran-test skill before its commit — run it (NOT_CRAN=true; the suite is slow, so run_in_background) and confirm the frozen 1e-6 coefficient/C++ golden baselines report PASS, not SKIP. A bare Rscript run silently SKIPs them and verifies nothing. Then close the task with the close-task skill.
  archive:
    # /opsx:archive (or /opsx:close-task) discipline. Replaces the former
    # PreToolUse Bash hook, which matched command substrings and fired on
    # unrelated commands. The tracker now runs only as an explicit archive step.
    - Before doing anything else in the /opsx:archive flow — FIRST, while the change dir still exists at openspec/changes/<name>/ — run `bash .plan/opsx-archive-track.sh <name>`. It snapshots that change's progress.md to .plan/ (local-only) and appends a version row to the tracked .plan/goldfish_versions.csv ledger (idempotent on the change name).
    - This step is additive and read-only on .plan/ only; it does NOT move, sync, or alter the change or specs. Run it, then proceed with the skill's normal steps (status check, delta-spec sync, and the mv to openspec/changes/archive/<date>-<name>). Never let its outcome block the archive — the script always exits 0.
    - Then, still BEFORE the delta-spec sync, run `bash .plan/opsx-spec-placement-check.sh <name>`. `openspec validate` does not check `##` section placement, so a `## MODIFIED`/`## REMOVED` block naming a requirement absent from openspec/specs/** validates cleanly and then silently lands as an ADD at archive, leaving the old wording in place. Unlike the tracker above, this one CAN block: a non-zero exit means fix the delta's section placement (or declare the rename in `## RENAMED`) before syncing. It is rename-aware and safe to re-run post-archive as `archive/<date>-<name>`.
    - /opsx:archive runs ONLY on the integration branch (ADR-0040). A change developed on a feature branch stays active — deltas unfolded — until the branch merges; the fold then happens on the trunk, where the living spec's current wording is known. Archiving on a branch is how make-multivariate-spec dissolved in the DyNES merge.
    - openspec/changes/archive/ is TRACKED (ADR-0041) so archived decision memory (proposal, design, deltas, tasks) travels with every clone and branch. The personal session journal does not — progress*.md is gitignored at any depth, and the tracker script's .plan/ snapshot is its preservation mechanism, so after the tracker runs, delete progress*.md from the change dir before the archive mv. Never edit an archived change; archives are append-only by construction.
  branching:
    # Parallel variant branches, each carrying OpenSpec changes (ADR-0041).
    - A change completed on a branch is NOT archived there. Flip it to landed instead — add `status: landed (<branch>, awaiting fold)` to its proposal.md — and leave the directory in place. A landed change is inert; its tracked artifacts are the decision memory until the trunk fold.
    - A change whose deltas build on another un-archived change declares it with `depends-on: <change>` in proposal.md and writes its deltas against the POST-predecessor wording (its `## MODIFIED` may name a requirement that today exists only in the predecessor's `## ADDED`). The placement pre-flight is EXPECTED to fail for such a change until the predecessor folds — that is deferral, not a defect; the check that counts runs at fold time, in dependency order.
    - Where a completed change is separable from its variant's unlanded siblings (code and deltas independent), prefer landing it on the integration branch via its own small merge over waiting for the variant to mature — fold latency is merge cadence.
  merge:
    # Landing a feature branch on the integration branch (ADR-0040). The
    # merge IS the milestone: every fold the branch deferred happens here,
    # once, in this order.
    - Keep the merge commit PURE (code conflicts only); every fold below lands in its own commit(s) immediately after, so a botched fold reverts without touching the code merge and the bump commit is a clean tag anchor.
    - Fold NEWS.d/ fragments into NEWS.md under the new version heading (filename order), delete the consumed fragments, and bump DESCRIPTION Version — the single milestone bump for everything the branch landed.
    - Archive the branch's landed changes on the trunk IN depends-on ORDER (a successor's delta headers resolve only after its predecessor's ADDED requirements fold): for each, the normal rules.archive sequence (tracker first, placement pre-flight, delta sync, journal scrub). Then run `openspec validate` across ALL active changes — the merge may have moved living-spec wording under other changes' deltas.
    - Regenerate, never hand-merge, generated files: Rcpp bindings via the cpp-recompile skill and man/NAMESPACE via devtools::document() on the merge result.
    - Full NOT_CRAN=true suite with the frozen 1e-6 baselines reporting PASS, not SKIP. Any intentional baseline move happens here on the trunk under the ADR-0021 bar, never on the branch.
    - Merge review (vault): capture decisions that arrived embedded in the branch as ADRs, re-ground affected active proposals, append the version row context to .plan/goldfish_versions.csv if the archive tracker did not, and drop a dashboard fragment in the vault _dashboard-inbox/.
    - After ANY fold lands on the trunk, every still-open variant branch merges the integration branch in promptly and re-runs `bash .plan/opsx-spec-placement-check.sh` across its own active changes, fixing delta headers against the freshly folded spec wording while context is fresh — not months later at its own merge.
